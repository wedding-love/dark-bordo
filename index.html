<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1113">
<title>Wedding day — Михаил и Алеся</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

<style>
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    height: 100%;
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100svh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 6vh, 60px) clamp(16px, 6vw, 60px);
    font-family: 'Montserrat', sans-serif;
    background-color: #1a1113;
    overflow-x: hidden;
    overflow-y: auto;
    animation: pageIn 1.2s ease both;
  }

  /* Фон — Изображение 7.jpeg */
  .bg {
    position: fixed;
    inset: 0;
    background-image: url('Изображение 7.jpeg');
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
    z-index: -1;
    /* небольшой запас на мобильных при динамическом изменении адресной строки */
    height: 100%;
    width: 100%;
  }

  .content {
    text-align: center;
    color: #7A1F2B;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2.4vh, 28px);
    width: 100%;
    max-width: 1100px;
    margin: auto 0;
  }

  .fade {
    opacity: 0;
    animation: fadeUp 2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    will-change: opacity, transform, filter;
    text-shadow: 0 1px 14px rgba(255, 255, 255, 0.28);
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(26px);
      filter: blur(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
  }

  @keyframes pageIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* 1. Wedding day */
  .wedding-day {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: clamp(0.65rem, 2.2vw, 1.05rem);
    letter-spacing: clamp(0.18em, 0.55vw, 0.55em);
    text-transform: uppercase;
    padding-left: clamp(0.18em, 0.55vw, 0.55em);
    animation-delay: 0.5s;
    line-height: 1.4;
  }

  /* 2. Имена */
  .names {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(2rem, 8.5vw, 6rem);
    line-height: 1.1;
    letter-spacing: 0.01em;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: center;
    gap: 0.25em;
    animation-delay: 1.6s;
    max-width: 100%;
  }

  .names .amp {
    font-style: normal;
    font-weight: 300;
    font-size: 0.55em;
    opacity: 0.75;
    transform: translateY(-0.08em);
  }

  /* Тонкая линия */
  .divider {
    width: clamp(50px, 12vw, 130px);
    height: 1px;
    background: currentColor;
    opacity: 0.45;
    animation-delay: 2.6s;
    text-shadow: none;
    flex-shrink: 0;
  }

  /* 3. Дата */
  .date {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: clamp(0.85rem, 3vw, 1.5rem);
    letter-spacing: clamp(0.18em, 0.5vw, 0.42em);
    padding-left: clamp(0.18em, 0.5vw, 0.42em);
    animation-delay: 3.2s;
    line-height: 1.4;
  }

  /* Уважение к настройкам пользователя */
  @media (prefers-reduced-motion: reduce) {
    .fade,
    body {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
      opacity: 1 !important;
      transform: none !important;
      filter: none !important;
    }
  }

  /* Узкие экраны (телефоны в портретной ориентации) */
  @media (max-width: 480px) {
    .names {
      flex-direction: column;
      gap: 0.05em;
    }
    .names .amp {
      font-size: 0.45em;
      transform: none;
    }
    .content {
      gap: clamp(8px, 2vh, 20px);
    }
  }

  /* Очень узкие экраны */
  @media (max-width: 360px) {
    body {
      padding: 4vh 4vw;
    }
    .wedding-day {
      font-size: clamp(0.6rem, 2vw, 0.8rem);
    }
    .names {
      font-size: clamp(1.7rem, 8vw, 2.6rem);
    }
    .date {
      font-size: clamp(0.75rem, 2.8vw, 1.1rem);
    }
  }

  /* Мобильные в горизонтальной ориентации с малой высотой */
  @media (max-height: 520px) and (orientation: landscape) {
    body {
      padding: 2vh 4vw;
    }
    .content {
      gap: 8px;
    }
    .wedding-day {
      font-size: clamp(0.55rem, 1.8vh, 0.85rem);
    }
    .names {
      font-size: clamp(1.5rem, 7vh, 3rem);
      flex-wrap: nowrap;
    }
    .names .amp {
      font-size: 0.5em;
    }
    .date {
      font-size: clamp(0.7rem, 2.2vh, 1rem);
    }
    .divider {
      width: 50px;
    }
  }

  /* Планшеты и небольшие ноутбуки */
  @media (min-width: 481px) and (max-width: 1024px) {
    .names {
      font-size: clamp(2.2rem, 7vw, 4rem);
    }
  }

  /* Большие экраны — ограничиваем чрезмерный рост шрифта */
  @media (min-width: 1600px) {
    .names {
      font-size: 6rem;
    }
    .wedding-day {
      font-size: 1.05rem;
    }
    .date {
      font-size: 1.5rem;
    }
  }
</style>
</head>
<body>

  <div class="bg"></div>

  <main class="content">
    <div class="fade wedding-day">Wedding day</div>

    <h1 class="fade names">
      <span>Михаил</span>
      <span class="amp">и</span>
      <span>Алеся</span>
    </h1>

    <div class="fade divider"></div>

    <div class="fade date">12.02.2027</div>
  </main>

  <script>
    window.addEventListener('load', () => {
      const names = document.querySelector('.names');
      if (!names) return;

      setTimeout(() => {
        names.style.transition = 'transform 6s ease-in-out';
        names.style.transform = 'translateY(-3px)';
        setTimeout(() => {
          names.style.transform = 'translateY(0)';
        }, 3000);
      }, 3800);
    });
  </script>

</body>
</html>
